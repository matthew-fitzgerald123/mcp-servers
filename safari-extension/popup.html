<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    width: 280px;
    background: #fff;
    color: #1a1a1a;
  }
  header {
    background: #0a66c2;
    color: #fff;
    padding: 11px 14px;
    font-size: 14px;
    font-weight: 600;
  }
  .card {
    padding: 14px;
  }
  .field { margin-bottom: 10px; }
  .label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #888;
    margin-bottom: 2px;
  }
  .value {
    font-size: 14px;
    font-weight: 500;
    color: #111;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .value.muted { color: #999; font-weight: 400; font-style: italic; }
  .source-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    background: #e8f0fe;
    color: #0a66c2;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 11px;
    background: #0a66c2;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #aaa; cursor: default; }
  button:hover:not(:disabled) { background: #084fa3; }
  #msg {
    margin-top: 8px;
    font-size: 12px;
    text-align: center;
    color: #1a7a3e;
    min-height: 16px;
  }
  #msg.err { color: #b31a1a; }
  #not-a-job {
    padding: 24px 16px;
    text-align: center;
    font-size: 13px;
    color: #888;
    line-height: 1.5;
  }
</style>
</head>
<body>
<header>Job Tracker</header>
<div id="not-a-job" style="display:none">
  Navigate to a job listing page, then click capture.
</div>
<div id="main" class="card" style="display:none">
  <div id="source-tag" class="source-tag"></div>
  <div class="field">
    <div class="label">Company</div>
    <div class="value" id="company"></div>
  </div>
  <div class="field">
    <div class="label">Role</div>
    <div class="value" id="role"></div>
  </div>
  <div class="field" id="loc-row">
    <div class="label">Location</div>
    <div class="value" id="location"></div>
  </div>
  <button id="btn">Capture Application</button>
  <div id="msg"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
